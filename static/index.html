<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>blog-gen — Humanizer Pipeline</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262b36;
    --text: #e6e8ee;
    --muted: #9aa2b1;
    --accent: #4f8cff;
    --green: #37c98a;
    --amber: #f5a623;
    --red: #ef5b5b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 18px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 18px; margin: 0; }
  header .badge {
    font-size: 12px;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 999px;
  }
  main { max-width: 1080px; margin: 0 auto; padding: 28px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 22px;
    margin-bottom: 22px;
  }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  input, textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 10px 12px;
    font-size: 14px;
    margin-bottom: 14px;
  }
  textarea { min-height: 70px; resize: vertical; }
  .row { display: flex; gap: 14px; }
  .row > div { flex: 1; }
  button {
    background: var(--accent);
    color: #fff;
    border: 0;
    border-radius: 8px;
    padding: 11px 22px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .post { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .post:last-child { border-bottom: 0; }
  .post .meta { font-size: 12px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
  .post .title { font-weight: 600; margin: 6px 0 4px; cursor: pointer; color: var(--text); }
  .post .title:hover { color: var(--accent); }
  .status { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); }
  .status.completed { color: var(--green); border-color: var(--green); }
  .status.failed { color: var(--red); border-color: var(--red); }
  .status.queued, .status.generating { color: var(--amber); border-color: var(--amber); }
  .score { font-variant-numeric: tabular-nums; }
  .score.low { color: var(--green); }
  .score.high { color: var(--red); }
  .score.mid { color: var(--amber); }
  article { line-height: 1.75; font-size: 15px; }
  article h2 { font-size: 19px; margin-top: 26px; }
  article p { margin: 12px 0; }
  .rev { border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
  .rev .rev-head { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .rev pre { white-space: pre-wrap; font-family: inherit; font-size: 14px; line-height: 1.7; margin: 0; color: var(--text); }
  .back { display: inline-block; color: var(--accent); text-decoration: none; font-size: 14px; margin-bottom: 16px; }
  .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--border); padding: 10px 18px; border-radius: 8px; font-size: 13px; display: none; }
</style>
</head>
<body>
<header>
  <h1>blog-gen · humanizer pipeline</h1>
  <span class="badge" id="mode-badge">loading…</span>
</header>
<main>
  <div id="list-view">
  <div class="card">
    <h2 style="margin-top:0; font-size:16px;">Generate a blog post</h2>
    <form id="gen-form">
      <label for="topic">Topic</label>
      <input id="topic" name="topic" placeholder="e.g. How I scaled my side project to 10k users" required />
      <div class="row">
        <div>
          <label for="threshold">AI threshold (0–1)</label>
          <input id="threshold" name="threshold" type="number" step="0.05" min="0" max="1" value="0.6" />
        </div>
        <div>
          <label for="iterations">Max humanize iterations</label>
          <input id="iterations" name="iterations" type="number" min="0" max="10" value="3" />
        </div>
        <div>
          <label for="temperature">Temperature</label>
          <input id="temperature" name="temperature" type="number" step="0.05" min="0" max="2" value="0.85" />
        </div>
      </div>
      <button type="submit" id="gen-btn">Generate</button>
    </form>
  </div>

  <div class="card">
    <h2 style="margin-top:0; font-size:16px;">Recent posts</h2>
    <div id="posts"></div>
  </div>
  </div>

  <div id="detail-view" style="display:none"></div>
</main>

<div id="toast"></div>

<script>
  const $ = (s) => document.querySelector(s);
  const toast = (msg) => {
    const t = $("#toast");
    t.textContent = msg;
    t.style.display = "block";
    setTimeout(() => (t.style.display = "none"), 3000);
  };
  const scoreClass = (s) => (s == null ? "" : s < 0.4 ? "low" : s < 0.6 ? "mid" : "high");

  async function loadMode() {
    const r = await fetch("/api/health");
    const j = await r.json();
    $("#mode-badge").textContent = "mode: " + (j.mode || "local");
  }

  function esc(s) {
    return (s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function md(s) {
    return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/^### (.*)$/gm, "<h3>$1</h3>")
      .replace(/^## (.*)$/gm, "<h2>$1</h2>")
      .replace(/^# (.*)$/gm, "<h1>$1</h1>")
      .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
      .replace(/\n/g, "</p><p>");
  }

  function renderPosts(list) {
    const el = $("#posts");
    if (!list.length) { el.innerHTML = '<p style="color:var(--muted)">No posts yet.</p>'; return; }
    el.innerHTML = list.map((p) => `
      <div class="post">
        <div class="meta">
          <span class="status ${p.status}">${p.status}</span>
          ${p.stage ? `<span>${esc(p.stage)}</span>` : ""}
          <span class="score ${scoreClass(p.final_score)}">AI score: ${p.final_score == null ? "—" : p.final_score}</span>
          <span>detector: ${p.detector || "—"}</span>
          <span>iterations: ${p.iterations_used || 0}</span>
          <span>${new Date(p.created_at).toLocaleString()}</span>
        </div>
        <div class="title" onclick="openPost('${p.id}')">${esc(p.title || p.topic)}</div>
      </div>`).join("");
  }

  async function loadPosts() {
    const r = await fetch("/api/posts");
    const j = await r.json();
    renderPosts(j.posts);
  }

  window.showList = function () {
    $("#detail-view").style.display = "none";
    $("#list-view").style.display = "";
    loadPosts();
  };

  window.openPost = async function (id) {
    $("#list-view").style.display = "none";
    $("#detail-view").style.display = "";
    $("#detail-view").innerHTML = '<p style="color:var(--muted)">Loading…</p>';
    try {
      const r = await fetch("/api/posts/" + id);
      const j = await r.json();
      if (!r.ok) throw new Error(j.detail || "not found");
      renderDetail(j);
    } catch (err) {
      $("#detail-view").innerHTML =
        '<p style="color:var(--red)">Failed to load: ' + esc(err.message) + "</p>";
    }
  };

  function renderDetail(j) {
    const p = j.post;
    const revisions = (j.revisions || []).map((rev) => `
      <div class="rev">
        <div class="rev-head">
          <span>iteration ${rev.iteration}</span>
          <span class="score ${scoreClass(rev.ai_score)}">AI score: ${rev.ai_score == null ? "—" : rev.ai_score} (${rev.detector})</span>
        </div>
        <pre>${esc(rev.content)}</pre>
      </div>`).join("") || '<p style="color:var(--muted)">No revisions.</p>';
    $("#detail-view").innerHTML = `
      <a class="back" href="javascript:void(0)" onclick="showList()">← back to list</a>
      <div class="card">
        <div class="meta" style="display:flex; gap:12px; font-size:12px; color:var(--muted); flex-wrap:wrap;">
          <span class="status ${p.status}">${p.status}</span>
          <span class="score ${scoreClass(p.final_score)}">AI score: ${p.final_score == null ? "—" : p.final_score}</span>
          <span>detector: ${p.detector || "—"}</span>
          <span>iterations used: ${p.iterations_used || 0}</span>
          <span>${new Date(p.created_at).toLocaleString()}</span>
        </div>
        <h2 style="margin-bottom:4px;">${esc(p.title || p.topic)}</h2>
        <p style="color:var(--muted); font-size:13px;">${esc(p.topic)}</p>
        <article><p>${md(p.content)}</p></article>
      </div>
      <div class="card">
        <h2 style="margin-top:0; font-size:16px;">Revisions (eval loop)</h2>
        ${revisions}
      </div>`;
  }

  $("#gen-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = $("#gen-btn");
    btn.disabled = true;
    btn.textContent = "Generating…";
    const body = {
      topic: $("#topic").value,
      threshold: parseFloat($("#threshold").value),
      max_iterations: parseInt($("#iterations").value, 10),
      temperature: parseFloat($("#temperature").value),
    };
    try {
      const r = await fetch("/api/generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const j = await r.json();
      if (!r.ok) throw new Error(j.detail || "request failed");
      toast("request " + j.status + " — " + j.request_id);
      if (j.status === "completed" && j.post) {
        openPost(j.request_id);
      } else {
        poll(j.request_id);
      }
    } catch (err) {
      toast("error: " + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = "Generate";
      loadPosts();
    }
  });

  let pollTimer = null;
  function poll(id) {
    clearInterval(pollTimer);
    let lastElapsed = 0;
    pollTimer = setInterval(async () => {
      const r = await fetch("/api/status/" + id);
      const j = await r.json();
      if (j.status === "completed") {
        clearInterval(pollTimer);
        toast("done!");
        loadPosts();
        openPost(id);
      } else if (j.status === "failed") {
        clearInterval(pollTimer);
        toast("failed: " + (j.error || "unknown error"));
        loadPosts();
      } else {
        const st = j.stage || "…";
        const secs = j.elapsed_seconds || lastElapsed;
        lastElapsed = secs;
        toast("working: " + st + " — " + secs + "s");
      }
    }, 2000);
  }

  async function boot() {
    await loadMode();
    await loadPosts();
  }
  boot();
</script>
</body>
</html>
